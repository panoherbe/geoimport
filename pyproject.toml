[project]
name = "geoimport"
version = "0.2.0"
description = "Import pipeline for WFS and CSV geodata into PostgreSQL/PostGIS, replacing one source at a time in the platform tables, with a change log and a report per run (prototype)"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
geoimport = "geoimport.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geoimport"]

[tool.setuptools.package-data]
geoimport = ["schema.sql"]
