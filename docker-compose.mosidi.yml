# Addition to the MOSIDI Compose file: the pipeline as one more service next to backend, with the
# same .env and the same database service brandenburg_db. Copy this folder to services/geoimport, then:
#   docker compose -f docker-compose.yml -f services/geoimport/docker-compose.mosidi.yml up -d geoimport
#   docker compose -f docker-compose.yml -f services/geoimport/docker-compose.mosidi.yml run --rm geoimport run
services:
  geoimport:
    build: ./services/geoimport
    env_file: [.env]
    environment: [POSTGRES_HOST=brandenburg_db]
    volumes:
      - ./services/geoimport/sources:/app/sources:ro
      - ./services/geoimport/reports:/app/reports
      - geoimport_daten:/app/data
    command: ["dienst", "--intervall", "3600"]
    depends_on: [brandenburg_db]
    restart: unless-stopped
volumes:
  geoimport_daten:
